<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- DNS+TLS chauds avant la 1re tuile (style, glyphes, tuiles IGN, BAN) :
         maplibre fetch en CORS, d'où le crossorigin. ~300-500 ms gagnées. -->
    <link rel="preconnect" href="https://data.geopf.fr" crossorigin />
    <link rel="dns-prefetch" href="https://data.geopf.fr" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Thème sombre appliqué AVANT le premier rendu (pas de flash blanc au
      // lancement de la PWA). La logique vivante est dans src/lib/theme.ts.
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (
            t === 'dark' ||
            (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.dataset.theme = 'dark'
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#121214')
          }
        } catch (e) {
          /* stockage indisponible : clair par défaut */
        }
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prospection" />
    <title>AppProspection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
